[package]
name = "stamp_rally"
version = "0.1.0"
edition = "2024"

[dependencies]
argon2 = "0.5.3"
askama = "0.16.0"
askama_web = { version = "0.16.0", features = ["axum-0.8"] }
axum = "0.8.9"
chrono = "0.4.45"
dotenvy = "0.15.7"
image = "0.25.10"
qrcode = "0.14.1"
reqwest = { version = "0.13.4", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sqlx = { version = "0.8.6", features = ["mysql", "runtime-tokio", "macros", "chrono", "uuid"] }
tokio = { version = "1.52.3", features = ["full"] }
tower-sessions = "0.15.0"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.23.4", features = ["v4"] }

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }
