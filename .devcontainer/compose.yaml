services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootroot
      MYSQL_DATABASE: stamprally
      MYSQL_USER: gantaro
      MYSQL_PASSWORD: stamprally_dev_pass
    ports:
      - "127.0.0.1:3307:3306"
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootroot"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db-data:/var/lib/mysql

  rust_app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: mysql://gantaro:stamprally_dev_pass@db:3306/stamprally
    volumes:
      - ..:/app
      - cargo-target:/app/target
    ports:
      - "127.0.0.1:8099:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  db-data:
  cargo-target:
