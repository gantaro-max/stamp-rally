{% extends "admin/_base.html" %}
{% block title %}部屋管理{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h3">部屋管理</h1>
  <a class="btn btn-primary" href="/admin/rooms/add">新規登録</a>
</div>
<table class="table table-striped align-middle">
  <thead><tr><th>部屋名</th><th>QR</th><th>操作</th></tr></thead>
  <tbody>
  {% for room in rooms %}
    <tr>
      <td>{{ room.room_name }}</td>
      <td><a href="/admin/rooms/{{ room.id }}/qr"><img src="/admin/rooms/{{ room.id }}/qr" alt="QRコード" width="60" height="60"></a></td>
      <td>
        <a class="btn btn-sm btn-outline-primary" href="/admin/rooms/edit/{{ room.id }}">編集</a>
        <form class="d-inline" method="post" action="/admin/rooms/delete/{{ room.id }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="btn btn-sm btn-outline-danger" type="submit">削除</button>
        </form>
      </td>
    </tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
