<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}管理画面{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary mb-4">
  <div class="container">
    <a class="navbar-brand" href="/admin/dashboard">Stamp Rally</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="/admin/rooms">部屋管理</a>
      <a class="nav-link" href="/admin/settings">設定</a>
      <a class="nav-link" href="/admin/ranking">ランキング</a>
    </div>
    <form method="post" action="/auth/logout">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-outline-secondary btn-sm" type="submit">ログアウト</button>
    </form>
  </div>
</nav>
<main class="container">
  {% block content %}{% endblock %}
</main>
</body>
</html>
