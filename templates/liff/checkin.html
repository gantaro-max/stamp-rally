<!doctype html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>チェックイン</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body class="bg-light">
    <main class="container py-5">
        <h1 class="h3 mb-4">チェックイン</h1>
        <button id="scan-button" type="button" class="btn btn-primary w-100">QRを読む</button>
        <p id="message" class="mt-3" role="status"></p>
    </main>
    <script>
        const message = document.getElementById('message');
        const button = document.getElementById('scan-button');

        async function initialize() {
            await liff.init({ liffId: "{{ liff_id }}" });
        }

        button.addEventListener('click', async () => {
            try {
                const result = await liff.scanCodeV2();
                const idToken = liff.getIDToken();
                const response = await fetch('/liff/checkin', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id_token: idToken, qr_uuid: result.value })
                });
                const body = await response.json();
                if (body.status === 'next') {
                    message.textContent = 'チェックインしました。次の案内はLINEチャットを確認してください。';
                } else if (body.status === 'cleared') {
                    message.textContent = 'クリアしました。LINEチャットを確認してください。';
                } else {
                    const reasonMessages = {
                        wrong_room: 'このQRコードはご案内している部屋のものではありません。LINEチャットで案内されている部屋をご確認ください。',
                        already_finished: '既に全部屋クリア済みです。',
                        not_registered: '参加登録が完了していません。LINEで「開始」と送信してください。',
                        answer_not_verified: '先にLINEで正解を送信してから、QRコードを読み込んでください。',
                        room_not_found: '無効なQRコードです。もう一度お試しください。',
                        invalid_id_token: '認証に失敗しました。時間をおいてもう一度お試しください。'
                    };
                    message.textContent = reasonMessages[body.reason] || 'チェックインできませんでした。LINEチャットの案内を確認してください。';
                }
            } catch (error) {
                message.textContent = 'QRの読み取りに失敗しました。もう一度お試しください。';
            }
        });

        initialize().catch(() => {
            message.textContent = 'LIFFの初期化に失敗しました。';
            button.disabled = true;
        });
    </script>
</body>
</html>
